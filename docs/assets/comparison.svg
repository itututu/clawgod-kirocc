<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ClawGod KiroCC feature comparison</title>
  <desc id="desc">A comparison of official Claude Code, ClawGod, upstream kirocc, and ClawGod KiroCC across Kiro backend support, ClawGod patches, native WebSearch, profile isolation, and preservation of the official Claude command.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07120d"/>
      <stop offset="1" stop-color="#10251a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .ui { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .muted { fill: #9fb6a8; }
      .heading { fill: #f2fff6; font-weight: 700; }
      .row { fill: #d7e9dd; font-size: 18px; }
      .yes { fill: #4ade80; font-size: 26px; font-weight: 800; }
      .no { fill: #73877a; font-size: 25px; font-weight: 700; }
      .partial { fill: #facc15; font-size: 15px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1090" cy="70" r="170" fill="#22c55e" opacity="0.07"/>
  <circle cx="95" cy="630" r="210" fill="#16a34a" opacity="0.06"/>

  <g class="ui">
    <text x="72" y="72" class="heading" font-size="34">ClawGod KiroCC</text>
    <text x="72" y="108" class="muted" font-size="20">Native Kiro WebSearch · isolated launcher · ClawGod runtime</text>
    <rect x="72" y="126" width="1056" height="4" rx="2" fill="url(#accent)"/>

    <g filter="url(#shadow)">
      <rect x="60" y="158" width="1080" height="422" rx="20" fill="#0c1b13" stroke="#234a32"/>
      <rect x="846" y="158" width="294" height="422" rx="20" fill="#123922" stroke="#34d16b" stroke-width="2"/>
    </g>

    <text x="280" y="207" class="muted" font-size="14" font-weight="700" letter-spacing="1.5">CAPABILITY</text>
    <text x="490" y="198" class="heading" font-size="16" text-anchor="middle">Official</text>
    <text x="490" y="220" class="muted" font-size="14" text-anchor="middle">Claude Code</text>
    <text x="675" y="207" class="heading" font-size="16" text-anchor="middle">ClawGod</text>
    <text x="860" y="198" class="heading" font-size="16" text-anchor="middle">Upstream</text>
    <text x="860" y="220" class="muted" font-size="14" text-anchor="middle">kirocc 0.6.0</text>
    <text x="1030" y="198" fill="#86efac" font-size="16" font-weight="800" text-anchor="middle">This fork</text>
    <text x="1030" y="220" fill="#5ee38e" font-size="14" text-anchor="middle">ClawGod KiroCC</text>

    <g stroke="#284333" stroke-width="1">
      <line x1="82" y1="242" x2="1118" y2="242"/>
      <line x1="82" y1="306" x2="1118" y2="306"/>
      <line x1="82" y1="370" x2="1118" y2="370"/>
      <line x1="82" y1="434" x2="1118" y2="434"/>
      <line x1="82" y1="498" x2="1118" y2="498"/>
    </g>

    <text x="92" y="282" class="row">Kiro credential backend</text>
    <text x="92" y="346" class="row">ClawGod client patches</text>
    <text x="92" y="410" class="row">Native Kiro WebSearch</text>
    <text x="92" y="474" class="row">Isolated command + profile</text>
    <text x="92" y="538" class="row">Official <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">claude</tspan> untouched</text>

    <text x="490" y="283" class="no" text-anchor="middle">—</text>
    <text x="675" y="283" class="no" text-anchor="middle">—</text>
    <text x="860" y="283" class="yes" text-anchor="middle">✓</text>
    <text x="1030" y="283" class="yes" text-anchor="middle">✓</text>

    <text x="490" y="347" class="no" text-anchor="middle">—</text>
    <text x="675" y="347" class="yes" text-anchor="middle">✓</text>
    <text x="860" y="347" class="no" text-anchor="middle">—</text>
    <text x="1030" y="347" class="yes" text-anchor="middle">✓</text>

    <text x="490" y="411" class="no" text-anchor="middle">—</text>
    <text x="675" y="411" class="no" text-anchor="middle">—</text>
    <text x="860" y="411" class="no" text-anchor="middle">✕</text>
    <text x="1030" y="411" class="yes" text-anchor="middle">✓</text>

    <text x="490" y="475" class="partial" text-anchor="middle">native</text>
    <text x="675" y="475" class="no" text-anchor="middle">✕</text>
    <text x="860" y="475" class="partial" text-anchor="middle">manual</text>
    <text x="1030" y="475" class="yes" text-anchor="middle">✓</text>

    <text x="490" y="539" class="yes" text-anchor="middle">✓</text>
    <text x="675" y="539" class="no" text-anchor="middle">✕</text>
    <text x="860" y="539" class="yes" text-anchor="middle">✓</text>
    <text x="1030" y="539" class="yes" text-anchor="middle">✓</text>

    <rect x="72" y="607" width="8" height="8" rx="4" fill="#4ade80"/>
    <text x="94" y="618" class="muted" font-size="16">Client-side unlocks do not bypass provider quota, authentication, billing, or model access.</text>
    <text x="1128" y="648" fill="#5f7567" font-size="13" text-anchor="end">github.com/itututu/clawgod-kirocc</text>
  </g>
</svg>
