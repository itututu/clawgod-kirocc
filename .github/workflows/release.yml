name: Release

on:
  push:
    tags:
      - "v*-clawgod.*"

permissions:
  contents: write

env:
  GOEXPERIMENT: jsonv2

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code
      - name: go fix
        run: go fix ./... && git diff --exit-code
      - name: Validate integration files
        run: |
          bash -n scripts/install.sh scripts/uninstall.sh scripts/doctor.sh
          ./scripts/doctor.sh --help >/dev/null
          python3 -m json.tool config/settings.json >/dev/null
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: Run tests
        run: go test -race ./...

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
