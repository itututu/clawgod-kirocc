version: 2

builds:
  - id: kirocc
    main: ./cmd/kirocc
    binary: kirocc
    env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=jsonv2
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: kirocc
    ids:
      - kirocc
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - CHANGELOG.md
      - README.md
      - README_EN.md
      - README_ZH.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
